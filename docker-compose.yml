# ============================================================
# docker-compose.yml — iblai-ontology on-premise knowledge layer
#
# This stack does NOT include the agent runtime. It includes only the
# knowledge layer, the identity gateway, and the MCP exposure endpoint.
#
# Networking: the `ontology-internal` network is `internal: true`, so the
# MCP servers, database, vector store, and sync engine cannot reach the
# internet. Only `ontology-gateway` and `proxy` bridge to `ontology-exposed`.
# ============================================================
version: "3.9"

services:
  # --- MCP Inbound: Database Connectivity ---
  # Google MCP Toolbox for Databases — github.com/googleapis/mcp-toolbox
  # Connects to external DB interfaces (PeopleSoft Oracle, Postgres, Snowflake,
  # …) via the kind:source/tool/toolset definitions in config/tools.yaml.
  mcp-toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.5.0
    # /app/toolbox.yaml is generated from config/tools.yaml by `ontology mcp build`
    # (run automatically by `ontology deploy up`). It is the Toolbox-native
    # sources/tools/toolsets format, not the ontology DSL.
    command: ["--config", "/app/toolbox.yaml", "--address", "0.0.0.0", "--port", "5000"]
    volumes:
      - ./config/generated/toolbox.yaml:/app/toolbox.yaml
    env_file: .env.mcp
    networks:
      - ontology-internal
      # To reach source databases, add mcp-toolbox to the right network in a
      # docker-compose.override.yml (see docker-compose.override.example.yml):
      #   * a LOCAL source container's docker network (connect by hostname), or
      #   * an egress-capable network for a REMOTE source (connect by host/IP).
    restart: unless-stopped

  mcp-canvas:
    build: ./mcp-servers/canvas
    env_file: .env.canvas
    networks:
      - ontology-internal
    restart: unless-stopped

  mcp-slate:
    build: ./mcp-servers/slate
    env_file: .env.slate
    networks:
      - ontology-internal
    restart: unless-stopped

  mcp-navigate:
    build: ./mcp-servers/navigate
    env_file: .env.navigate
    networks:
      - ontology-internal
    restart: unless-stopped

  mcp-ldap:
    build: ./mcp-servers/ldap
    env_file: .env.ldap
    networks:
      - ontology-internal
    restart: unless-stopped

  mcp-twenty:
    build: ./mcp-servers/twenty
    env_file: .env.twenty
    networks:
      - ontology-internal
    restart: unless-stopped

  # --- Knowledge Store ---
  ontology-db:
    image: postgres:16-alpine
    volumes:
      - ontology-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/views.sql:/docker-entrypoint-initdb.d/02-views.sql
    environment:
      POSTGRES_DB: ontology
      POSTGRES_USER: ontology
      POSTGRES_PASSWORD: ${ONTOLOGY_DB_PASSWORD}
    networks:
      - ontology-internal
    restart: unless-stopped

  vector-store:
    image: chromadb/chroma:0.6.3
    volumes:
      - vector-data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
      # Require a static bearer token so no other container on ontology-internal
      # can read/write embeddings without credentials (#2146).
      CHROMA_SERVER_AUTHN_PROVIDER: chromadb.auth.token_authn.TokenAuthenticationServerProvider
      CHROMA_SERVER_AUTHN_CREDENTIALS: ${CHROMA_TOKEN:?set CHROMA_TOKEN in .env}
    networks:
      - ontology-internal
    restart: unless-stopped

  # --- Sync Engine ---
  sync-engine:
    build:
      context: .
      dockerfile: sync-engine/Dockerfile
    volumes:
      - ontology-files:/ontology
      # The config directory the backend reads (/app/config): schedules, tools, generated/.
      - ./config:/app/config:ro
    environment:
      MCP_TOOLBOX_URL: http://mcp-toolbox:5000
      # API sources: a schedule's `<name>-mcp` source is read at MCP_<NAME>_URL.
      MCP_CANVAS_URL: http://mcp-canvas:3000
      MCP_SLATE_URL: http://mcp-slate:3000
      MCP_NAVIGATE_URL: http://mcp-navigate:3000
      MCP_LDAP_URL: http://mcp-ldap:3000
      MCP_TWENTY_URL: http://mcp-twenty:3000
      ONTOLOGY_DB_URL: postgresql://ontology:${ONTOLOGY_DB_PASSWORD}@ontology-db:5432/ontology
      CHROMA_URL: http://vector-store:8000
      CHROMA_TOKEN: ${CHROMA_TOKEN:?set CHROMA_TOKEN in .env}
      # Database sources are read through their own connection, so the sync engine
      # decrypts the registry too.
      ONTOLOGY_CREDENTIAL_KEY_FILE: /run/secrets/ontology_credential_key
      ONTOLOGY_DATA_STORE: ${ONTOLOGY_DATA_STORE:-local}
      IBLAI_BASE_URL: ${IBLAI_BASE_URL:-}
      IBLAI_ORG: ${IBLAI_ORG:-}
      IBLAI_ADMIN_TOKEN: ${IBLAI_ADMIN_TOKEN:-}
      IBLAI_AUTH_SCHEME: ${IBLAI_AUTH_SCHEME:-}
    secrets:
      - ontology_credential_key
    depends_on:
      - mcp-toolbox
      - mcp-canvas
      - ontology-db
      - vector-store
    networks:
      - ontology-internal
      # The DM (ONTOLOGY_DATA_STORE=dm) and remote source databases are reached from here,
      # as docker-compose.override.example.yml documents for the Toolbox.
      - ontology-exposed
    restart: unless-stopped

  # --- MCP Outbound: Exposure Gateway ---
  ontology-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    volumes:
      - ontology-files:/ontology:ro
      # Writable: the Ontology Frontend saves roles, schedules and tools through the gateway.
      - ./config:/app/config
    environment:
      MCP_TOOLBOX_URL: http://mcp-toolbox:5000
      ONTOLOGY_DB_URL: postgresql://ontology:${ONTOLOGY_DB_PASSWORD}@ontology-db:5432/ontology
      CHROMA_URL: http://vector-store:8000
      CHROMA_TOKEN: ${CHROMA_TOKEN:?set CHROMA_TOKEN in .env}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      ONTOLOGY_CREDENTIAL_KEY_FILE: /run/secrets/ontology_credential_key
      ONTOLOGY_DATA_STORE: ${ONTOLOGY_DATA_STORE:-local}
      ONTOLOGY_ROLES_TTL: ${ONTOLOGY_ROLES_TTL:-}
      IBLAI_BASE_URL: ${IBLAI_BASE_URL:-}
      IBLAI_ORG: ${IBLAI_ORG:-}
      IBLAI_ADMIN_TOKEN: ${IBLAI_ADMIN_TOKEN:-}
      IBLAI_AUTH_SCHEME: ${IBLAI_AUTH_SCHEME:-}
    secrets:
      - ontology_credential_key
    depends_on:
      - mcp-toolbox
      - ontology-db
      - vector-store
    networks:
      - ontology-internal
      - ontology-exposed
    restart: unless-stopped

  # --- HTTPS Reverse Proxy ---
  proxy:
    image: caddy:2-alpine
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    ports:
      - "443:443"
    depends_on:
      - ontology-gateway
    networks:
      - ontology-exposed
    restart: unless-stopped

  # --- Admin Dashboard ---
  admin-dashboard:
    build: ./admin-dashboard
    environment:
      ONTOLOGY_DB_URL: postgresql://ontology:${ONTOLOGY_DB_PASSWORD}@ontology-db:5432/ontology
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
    networks:
      - ontology-internal
      - ontology-exposed
    restart: unless-stopped

# Registry Fernet key — generate once:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" > secrets/ontology_credential_key
secrets:
  ontology_credential_key:
    file: ./secrets/ontology_credential_key

networks:
  ontology-internal:
    driver: bridge
    internal: true            # No external access to internal services
  ontology-exposed:
    driver: bridge            # Gateway and proxy can reach the outside

volumes:
  ontology-data:
  ontology-files:
  vector-data:
  caddy-data:
