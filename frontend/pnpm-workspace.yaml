allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  canvas: false
  msw: false
  sharp: false
# First-party ibl.ai packages: trusted, released frequently — exempt from the
# supply-chain release-age delay.
minimumReleaseAgeExclude:
  - "@iblai/*"
  - "@oxfmt/binding-android-arm-eabi@0.77.0"
  - "@oxfmt/binding-android-arm64@0.77.0"
  - "@oxfmt/binding-darwin-arm64@0.77.0"
  - "@oxfmt/binding-darwin-x64@0.77.0"
  - "@oxfmt/binding-freebsd-x64@0.77.0"
  - "@oxfmt/binding-linux-arm-gnueabihf@0.77.0"
  - "@oxfmt/binding-linux-arm-musleabihf@0.77.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.77.0"
  - "@oxfmt/binding-linux-arm64-musl@0.77.0"
  - "@oxfmt/binding-linux-ppc64-gnu@0.77.0"
  - "@oxfmt/binding-linux-riscv64-gnu@0.77.0"
  - "@oxfmt/binding-linux-riscv64-musl@0.77.0"
  - "@oxfmt/binding-linux-s390x-gnu@0.77.0"
  - "@oxfmt/binding-linux-x64-gnu@0.77.0"
  - "@oxfmt/binding-linux-x64-musl@0.77.0"
  - "@oxfmt/binding-openharmony-arm64@0.77.0"
  - "@oxfmt/binding-win32-arm64-msvc@0.77.0"
  - "@oxfmt/binding-win32-ia32-msvc@0.77.0"
  - "@oxfmt/binding-win32-x64-msvc@0.77.0"
  - "@oxlint/binding-android-arm-eabi@1.92.0"
  - "@oxlint/binding-android-arm64@1.92.0"
  - "@oxlint/binding-darwin-arm64@1.92.0"
  - "@oxlint/binding-darwin-x64@1.92.0"
  - "@oxlint/binding-freebsd-x64@1.92.0"
  - "@oxlint/binding-linux-arm-gnueabihf@1.92.0"
  - "@oxlint/binding-linux-arm-musleabihf@1.92.0"
  - "@oxlint/binding-linux-arm64-gnu@1.92.0"
  - "@oxlint/binding-linux-arm64-musl@1.92.0"
  - "@oxlint/binding-linux-ppc64-gnu@1.92.0"
  - "@oxlint/binding-linux-riscv64-gnu@1.92.0"
  - "@oxlint/binding-linux-riscv64-musl@1.92.0"
  - "@oxlint/binding-linux-s390x-gnu@1.92.0"
  - "@oxlint/binding-linux-x64-gnu@1.92.0"
  - "@oxlint/binding-linux-x64-musl@1.92.0"
  - "@oxlint/binding-openharmony-arm64@1.92.0"
  - "@oxlint/binding-win32-arm64-msvc@1.92.0"
  - "@oxlint/binding-win32-ia32-msvc@1.92.0"
  - "@oxlint/binding-win32-x64-msvc@1.92.0"
  - oxfmt@0.77.0
  - oxlint@1.92.0
# One physical copy of each @iblai/* package, hoisted to the root: the SDK's
# React contexts live on the module instance, so a second copy makes its
# RTK Query hooks return undefined.
dedupePeerDependents: true
publicHoistPattern:
  - "@iblai/*"
# Node 25+ exposes a `localStorage` global whose getter throws without --localstorage-file;
# the SDK's browser-storage guards need it undefined during SSR (every script, not just dev).
nodeOptions: --no-experimental-webstorage
