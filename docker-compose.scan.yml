# Scan-only override: publish the gateway on the host so a Shannon worker
# container can reach it via host.docker.internal:8080. Bypasses Caddy, which
# needs a real domain and certificate. Temporary; tear down after the scan.
# Compose file used explicitly via -f, not auto-loaded.
services:
  ontology-gateway:
    ports:
      - "0.0.0.0:8080:8080"
